    - tests/unit/gateway/test_delivery.py::test_internal_sentinels_filtered
    - tests/integration/test_gateway.py::test_user_never_sees_sentinel
    - tests/property/test_delivery.py::test_no_internal_markers_in_output
    acceptance_criteria:
    - Zero internal markers in gateway-delivered messages
    - All sentinels filtered before delivery
    - 'Property test: no internal markers in any generated output'
    github_issue: https://github.com/NousResearch/hermes-agent/issues/157239
    dependencies:
    - P0.T3
    status: pending
  - id: P21.T11
    title: Fix custom model configurations vanished after update (#25272)
    description: 'Bug: after v0.13.0 update, all custom model configurations

      vanished. Only 2 models remained available instead of the full

      set. Migration script overwrote user config.

      Fix: migration preserves existing config.yaml. Backup before

      migration. Detect config schema changes, prompt user for merge.

      Note: also covered by Phase 18 (backup & recovery) but apply

      specific fix for config.yaml preservation.

      Check 4: decoupled from P1.T6/P18.T4 — the fix is self-contained

      (install/config code available after Phase 0), so this critical bug

      is fixed FIRST together with P21.T1.

      '
    files_to_create:
    - hermes/install/migrations.py
    files_to_modify:
    - hermes/config.py
    tests_to_write:
    - tests/integration/test_migration.py::test_config_yaml_preserved
    - tests/integration/test_migration.py::test_backup_before_config_change
    - tests/integration/test_migration.py::test_user_prompted_on_schema_change
    - tests/integration/test_migration.py::test_no_config_loss_on_update
    acceptance_criteria:
    - Config.yaml preserved across updates
    - Backup created before any config change
    - User prompted on schema changes
    - 'No config loss reproducing issue #25272 scenario'
    github_issue: https://github.com/NousResearch/hermes-agent/issues/25272
    dependencies:
    - P0.T3
    status: pending
  - id: P21.T12
    title: Fix ACP turn keeps running after editor exits (#156173)
    description: 'Bug: ACP (Agent Client Protocol) — turn keeps running after

      editor''s ACP process exits. Session/load of that session fails

      with bare ''Internal error''.

      Fix: detect ACP process exit, terminate associated turn cleanly.

      Save session state before failure. Better error message.

      '
    files_to_create:
