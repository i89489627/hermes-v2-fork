phase_22:
  id: phase_22
  name: Performance optimization
  goal: 'After all functional phases: latency profiling, token reduction, caching layer, cost tuning.
    Targets: >=20% latency reduction, >=15% token reduction, cache hit rate >=30%, end-to-end injection
    within 5s budget.'
  tasks:
  - id: P22.T1
    title: Implement performance profiler
    description: 'hermes/optimization/performance.py — profile_memory_ops(n_turns=100) -> ProfileReport.
      Identifies: slowest ops, most expensive ops (tokens), cache miss rates. Scheduling: after all
      functional phases (plan Section 7); hard dependencies below list only the profiler inputs.'
    files_to_create:
    - hermes/optimization/performance.py
    files_to_modify: []
    tests_to_write:
    - tests/benchmark/test_optimization.py::test_profiler_reports_slowest_ops
    - tests/benchmark/test_optimization.py::test_profiler_reports_token_costs
    - tests/benchmark/test_optimization.py::test_profiler_reports_cache_miss_rate
    acceptance_criteria:
    - ProfileReport covers all memory operations (retrieval, gating, extraction, review)
    - Top-3 slowest and top-3 most expensive ops identified
    dependencies:
    - P4.T4
    - P11.T1
    status: pending
  - id: P22.T2
    title: Implement MemoryCache
    description: hermes/memory/cache.py — memoize retrieval results (same query -> same result within
      TTL); batch multiple memory ops into single API call where possible (e.g., combine extractor+reviewer
      calls).
    files_to_create:
    - hermes/memory/cache.py
    files_to_modify:
    - hermes/memory/retrieval.py
    tests_to_write:
    - tests/unit/memory/test_cache.py::test_cache_hit_within_ttl
    - tests/unit/memory/test_cache.py::test_cache_invalidated_on_memory_update
    - tests/unit/memory/test_cache.py::test_batch_reduces_api_calls
    acceptance_criteria:
    - Cache hit rate >=30% for repeated queries
    - Cache invalidated when underlying memory entries change
    dependencies:
    - P22.T1
    status: pending
  - id: P22.T3
    title: Implement prompt optimizer
    description: hermes/core/prompt_optimizer.py — analyze prompt sizes, suggest reductions, track token
      usage per operation.
    files_to_create:
    - hermes/core/prompt_optimizer.py
    files_to_modify: []
    tests_to_write:
    - tests/unit/core/test_prompt_optimizer.py::test_prompt_size_report
    - tests/unit/core/test_prompt_optimizer.py::test_token_usage_tracked
    acceptance_criteria:
    - Token usage tracked per memory operation
    - Reduction suggestions generated for oversized prompts
    dependencies:
    - P22.T1
    status: pending
  - id: P22.T4
    title: Re-profile and document performance characteristics
    description: Re-run profiler after optimizations, verify improvement targets met, document performance
      characteristics in docs/performance.md.
    files_to_create:
    - docs/performance.md
    files_to_modify: []
    tests_to_write:
    - tests/benchmark/test_optimization.py::test_latency_improved_after_optimization
    - tests/benchmark/test_optimization.py::test_token_usage_reduced
    - tests/benchmark/test_optimization.py::test_cache_hit_rate_above_30_percent
    - tests/integration/test_performance.py::test_end_to_end_latency_within_budget
    acceptance_criteria:
    - Memory ops latency reduced by >=20% vs pre-optimization baseline
    - Token usage reduced by >=15%
    - End-to-end injection latency within 5s budget
    - Performance characteristics documented
    dependencies:
    - P22.T2
    - P22.T3
    status: pending
