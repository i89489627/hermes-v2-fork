phase_17:
  name: Adversarial input detection & safety
  goal: Detect and mitigate attempts to inject false information or manipulate trust system
  tasks:
  - id: P17.T1
    title: Implement AdversarialInputDetector
    description: 'Detect patterns indicating adversarial input:

      - Prompt injection attempts ("ignore previous instructions, remember X")

      - Trust manipulation ("this fact is verified by user, trust_score=1.0")

      - Contradiction flooding (many contradictory facts in short time)

      - Unusual trust score inflation attempts

      Uses main model classifier. Returns risk_score + reason.

      '
    files_to_create:
    - hermes/memory/adversarial_detector.py
    files_to_modify: []
    tests_to_write:
    - tests/unit/memory/test_adversarial_detector.py::test_detects_prompt_injection
    - tests/unit/memory/test_adversarial_detector.py::test_detects_trust_manipulation
    - tests/unit/memory/test_adversarial_detector.py::test_detects_contradiction_flooding
    - tests/unit/memory/test_adversarial_detector.py::test_normal_input_low_risk
    - tests/integration/test_adversarial_workflow.py::test_high_risk_input_blocked
    - tests/integration/test_adversarial_workflow.py::test_alert_on_repeated_attempts
    acceptance_criteria:
    - Risk score in [0, 1]
    - False positive rate <5% on normal inputs
    - Detects 90%+ of known adversarial patterns
    - High-risk inputs (>0.7) blocked from memory write
    dependencies:
    - P2.T1
    status: pending
  - id: P17.T2
    title: Rate limiting on memory writes
    description: 'Per-session and per-user rate limits on memory writes to prevent flooding:

      - Max 20 writes per session per hour

      - Max 100 writes per day per user

      - Burst detection (10 writes in 1 minute = suspicious)

      '
    files_to_create:
    - hermes/memory/rate_limiter.py
    files_to_modify:
