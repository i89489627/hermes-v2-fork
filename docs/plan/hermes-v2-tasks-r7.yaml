phase_21:
  name: Fix known Hermes bugs
  goal: Fix 12 most impactful open bugs from Hermes GitHub issues (memory, tools, MCP, sessions, cron)
  tasks:
  - id: P21.T1
    title: Fix ThreadPoolExecutor _interrupted_threads leak (#35309)
    description: 'Bug: when a worker thread raises BaseException, the thread ID gets

      "poisoned". ThreadPoolExecutor recycles thread IDs, so later tool

      executions on the same thread ID incorrectly think they''re interrupted

      (is_interrupted() returns True), causing tools to abort silently.

      Repro: prompt agent to use a tool that calls is_interrupted() after

      a previous tool crashed.

      Fix: track interrupted state per-execution (not per-thread-ID).

      Use threading.local() or pass execution context explicitly.

      '
    files_to_create:
    - hermes/core/tool_executor.py
    - hermes/core/execution_context.py
    tests_to_write:
    - tests/unit/core/test_execution_context.py::test_interrupt_state_per_execution
    - tests/unit/core/test_execution_context.py::test_thread_id_recycle_safe
    - tests/integration/test_tool_executor.py::test_crash_does_not_poison_next_call
    - tests/integration/test_tool_executor.py::test_is_interrupted_returns_correct_state
    - tests/chaos/test_tool_executor.py::test_concurrent_crashes_no_poisoning
    acceptance_criteria:
    - is_interrupted() returns correct state per-execution
    - Thread ID recycling doesn't cause false interrupts
    - Concurrent tool crashes don't poison other executions
    - 'All 5 repro scenarios from issue #35309 pass'
    github_issue: https://github.com/NousResearch/hermes-agent/issues/35309
    dependencies:
    - P0.T3
    status: pending
  - id: P21.T2
    title: Fix hot memory ignored + disabled tools used (#26568)
    description: 'Bug: after v0.13+ update, Hermes both (a) uses tools that are

      explicitly disabled in config, and (b) ignores hot memory entirely

      when acting. Likely a regression in tool filtering and memory

      injection wiring.

      Fix: audit tool enable/disable pipeline, ensure config.yaml

      toolsets filtering is enforced at tool registration time, not at

      call time. Ensure hot memory (recently added entries within session)

      is injected before each tool call.

      '
    files_to_create:
    - hermes/core/tool_registry.py
    files_to_modify:
    - hermes/memory/injector.py
    tests_to_write:
    - tests/unit/core/test_tool_registry.py::test_disabled_tool_not_registered
    - tests/unit/core/test_tool_registry.py::test_enabled_tool_registered
    - tests/integration/test_tools.py::test_disabled_tool_never_called
    - tests/integration/test_memory_injection.py::test_hot_memory_injected_before_tool_call
    - tests/integration/test_memory_injection.py::test_disabled_toolset_completely_ignored
    acceptance_criteria:
    - Disabled tools never appear in tool registry
    - Disabled tools never invoked even if model requests them
    - Hot memory (entries added in current session) injected before tool calls
    - 'All 4 repro scenarios from issue #26568 pass'
    github_issue: https://github.com/NousResearch/hermes-agent/issues/26568
    dependencies:
    - P4.T3
    - P1.T3
    status: pending
  - id: P21.T3
    title: Fix MCP tools/call arguments intermittently dropped (#156143)
    description: 'Bug: MCP stdio protocol — tool call arguments intermittently dropped.

      Server executes with defaults, caller sees no error. Silent data loss.

      Likely a JSON-RPC framing issue over stdio pipe.

      Fix: audit MCP stdio protocol implementation. Add explicit

      argument-schema validation on caller side. Add echo-back from

      server confirming arguments received. Log all MCP calls with

      full arguments for debugging.

      '
    files_to_create:
    - hermes/mcp/client.py
    - hermes/mcp/protocol.py
    - hermes/mcp/argument_validator.py
    tests_to_write:
    - tests/unit/mcp/test_argument_validator.py::test_validates_schema
    - tests/unit/mcp/test_argument_validator.py::test_rejects_missing_required
    - tests/integration/test_mcp_stdio.py::test_arguments_not_dropped
    - tests/integration/test_mcp_stdio.py::test_server_echoes_arguments
    - tests/chaos/test_mcp_stdio.py::test_high_concurrency_no_argument_loss
    - tests/property/test_mcp_argument_serializer.py::test_roundtrip_any_args
    acceptance_criteria:
    - Zero argument drops in 1000 consecutive MCP calls
    - Schema validation catches missing required arguments
    - Server echo confirms arguments received
    - All MCP calls logged with full arguments
    github_issue: https://github.com/NousResearch/hermes-agent/issues/156143
    dependencies:
    - P0.T3
    status: pending
  - id: P21.T4
    title: Fix skills search 86s cold cache (#156140)
    description: 'Bug: skills search takes ~86 seconds on cold index cache (52MB

      download). Silent degradation when index can''t be fetched — user

      sees no error, just slow or missing results.

      Fix: bundle base skills index with install (no cold download).

      Add explicit error when index fetch fails (no silent degradation).

      Add local fallback: if remote index unavailable, use local

      ~/.hermes/skills/ directory listing.

      '
    files_to_create:
    - hermes/skills/search.py
    - hermes/skills/index.py
    tests_to_write:
    - tests/unit/skills/test_search.py::test_cold_cache_under_5s_with_bundled_index
    - tests/unit/skills/test_search.py::test_remote_unavailable_uses_local_fallback
    - tests/integration/test_skills_search.py::test_no_silent_degradation
    - tests/integration/test_skills_search.py::test_error_message_on_fetch_failure
    - tests/benchmark/test_skills_search_latency.py::test_cold_search_under_5s
    acceptance_criteria:
    - Cold cache search <5s (was 86s)
    - Remote fetch failure shows explicit error
    - Local fallback works when remote unavailable
    - No silent degradation
    github_issue: https://github.com/NousResearch/hermes-agent/issues/156140
    dependencies:
    - P13.T2
    status: pending
  - id: P21.T5
    title: Fix cron stuck 'running' — inactivity watchdog (#156160)
    description: 'Bug: cron job agent run stuck in ''running'' state for 3h49m.

      Inactivity watchdog never fired. Ticks silently skipped. No

      incident logged. User has no idea cron is broken.

      Fix: implement proper inactivity watchdog (timeout after N minutes

      of no progress). Force-fail stuck runs. Log incident. Alert user

      via gateway message.


      Check 3: watchdog incidents surface via DiagnosticsSystem (Phase 14) as the cron_job_stuck alert
      — single alerting channel; direct gateway message kept only as fallback when diagnostics module
      is not deployed.

      '
    files_to_create:
    - hermes/cron/watchdog.py
    - hermes/cron/scheduler.py
    tests_to_write:
    - tests/unit/cron/test_watchdog.py::test_timeout_after_inactivity
    - tests/unit/cron/test_watchdog.py::test_force_fail_stuck_run
    - tests/integration/test_cron.py::test_incident_logged_on_stuck
    - tests/integration/test_cron.py::test_alert_sent_on_stuck
    - tests/chaos/test_cron.py::test_long_running_does_not_stick
    acceptance_criteria:
    - Inactivity watchdog fires after configurable timeout (default 30 min)
    - Stuck runs force-failed and logged
    - Incident surfaces as cron_job_stuck alert via DiagnosticsSystem (gateway message channel); direct
      gateway fallback when diagnostics absent
    - Ticks not silently skipped
    github_issue: https://github.com/NousResearch/hermes-agent/issues/156160
    dependencies:
    - P0.T3
    status: pending
  - id: P21.T6
    title: Fix state.db WAL errors / session storage unavailable
    description: 'Bug: state.db Write-Ahead Logging errors. Session storage

      unavailable errors. Context drift, missing sessions.

      Likely SQLite WAL configuration issue under concurrent access.

      Fix: audit SQLite WAL configuration. Set busy_timeout. Use

      IMMEDIATE transactions for writes. Add connection pooling.

      Verify multi-process access (concurrent writers from Phase 6).

      '
    files_to_create:
    - hermes/storage/database.py
    files_to_modify:
    - hermes/sessions/store.py
    tests_to_write:
    - tests/unit/storage/test_database.py::test_wal_no_errors_under_load
    - tests/unit/storage/test_database.py::test_busy_timeout_configured
    - tests/integration/test_sessions.py::test_no_storage_unavailable_errors
    - tests/integration/test_sessions.py::test_concurrent_access_no_wal_errors
    - tests/chaos/test_database.py::test_multi_process_concurrent_writes
    acceptance_criteria:
    - Zero WAL errors under concurrent load test
    - busy_timeout configured (default 5000ms)
    - No 'session storage unavailable' errors
    - Multi-process access works (no SQLITE_BUSY)
    dependencies:
    - P6.T3
    - P21.T12
    status: pending
  - id: P21.T7
    title: Fix clarify empty free-text misreported as timeout (#156171)
    description: 'Bug: when user submits empty free-text in a clarify prompt,

      Hermes misreports it as timeout (''user did not respond within Nm'').

      Confusing UX — user thinks they answered, system thinks they

      timed out.

      Fix: distinguish empty submission from timeout. Empty submission

      is a valid (if unhelpful) response — prompt again or proceed

      with default. Timeout is no response at all.

      '
    files_to_create:
    - hermes/gateway/clarify.py
    tests_to_write:
    - tests/unit/gateway/test_clarify.py::test_empty_submission_not_timeout
    - tests/unit/gateway/test_clarify.py::test_timeout_only_on_no_response
    - tests/integration/test_clarify.py::test_empty_submission_prompts_again
    - tests/integration/test_clarify.py::test_timeout_logs_correctly
    acceptance_criteria:
    - Empty submission not reported as timeout
    - Timeout only fires on actual no-response
    - Empty submission prompts user again (or uses default)
    - Correct logging for both cases
    github_issue: https://github.com/NousResearch/hermes-agent/issues/156171
    dependencies:
    - P0.T3
    status: pending
  - id: P21.T8
    title: Fix gateway shutdown retries after network loss (#156127)
    description: 'Bug: on macOS host reboot, gateway shutdown notice retries after

      network loss. Shutdown watchdog forces unclean exit.

      Fix: detect network loss during shutdown, abort retries gracefully.

      Clean exit even when network unavailable.

      '
    files_to_create:
    - hermes/gateway/shutdown.py
    tests_to_write:
    - tests/unit/gateway/test_shutdown.py::test_aborts_on_network_loss
    - tests/unit/gateway/test_shutdown.py::test_clean_exit_no_network
    - tests/integration/test_gateway.py::test_reboot_scenario_clean
    acceptance_criteria:
    - Network loss during shutdown detected
    - No retries after network loss
    - Clean exit even without network
    github_issue: https://github.com/NousResearch/hermes-agent/issues/156127
    dependencies:
    - P0.T3
    status: pending
  - id: P21.T9
    title: Fix webapp OOM-killed renderer (#156161)
    description: 'Bug: webapp renderer build has no heap cap. Update exits 0 (success)

      while the stage is OOM-killed. Bundle stays stale — user thinks

      update succeeded but it didn''t.

      Fix: set Node.js heap cap (--max-old-space-size) for renderer build.

      Detect OOM-kill exit code, fail update explicitly.

      '
    files_to_create:
    - scripts/build_webapp.sh
    - hermes/install/updater.py
    tests_to_write:
    - tests/integration/test_updater.py::test_oom_detected_and_reported
    - tests/integration/test_updater.py::test_no_silent_stale_bundle
    - tests/integration/test_updater.py::test_heap_cap_set
    acceptance_criteria:
    - Heap cap set on renderer build
    - OOM-kill detected and reported as failure
    - No silent stale bundle after OOM
    github_issue: https://github.com/NousResearch/hermes-agent/issues/156161
    dependencies:
    - P0.T3
    status: pending
  - id: P21.T10
    title: Fix bracketed NO_REPLY marker leaks into gateway delivery (#157239)
    description: 'Bug: bracketed NO_REPLY marker (internal sentinel) leaks into

      gateway delivery — user sees ''<NO_REPLY>'' or similar in their

      chat client.

      Fix: strip internal sentinels before gateway delivery. Audit all

      internal markers, ensure they''re filtered from user-facing output.

      '
    files_to_create:
    - hermes/gateway/delivery.py
    - hermes/core/streaming.py
    tests_to_write:
