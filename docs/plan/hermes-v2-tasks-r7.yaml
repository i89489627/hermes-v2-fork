meta:
  project: hermes-v2
  fork_base: github.com/NousResearch/hermes-agent
  fork_base_version: v2026.9.24 (commit f97608f)
  target_version: v2.1.0
  license: MIT
  plan_document: ./hermes-v2-improvement-plan-r7.md
  plan_version: v2.1-r7
  estimated_total_tasks: 112
  estimated_total_phases: 21
  # labor-time estimates removed in r5 (executor: coding agent/harness, not a human engineer);
  # execution order is defined by the task dependency graph
  revision_log:
  - rev: r1
    change: Initial 17-phase plan (720h)
  - rev: r2
    change: 'GLM review fixes: dependency order, hot-reload, phases 17-20, P3.T6, P14.T7-T10'
  - rev: r3
    change: Removed phase_9 (tiered models) and phase_12 (distillation); merged round2 supplements; added
      phase_22 (performance); fixed deps and texts referencing removed phases
  - rev: r3.1
    change: 'Final audit vs ZCode-plugin hypothesis: added P2.T5 (automatic ground-truth anchors) and
      P7.T5 (session compaction summaries); plan weights example fixed (tool-output 0.55 -> 0.85)'
  - rev: r3.2
    change: 'Check 3: mutation testing policy (plan Section 4.7, tasks P20.T5/P20.T6, Phase 21 regression
      tests must kill bug re-mutants, mutation CI gates); fixed day/hour mismatches (P3 6.5d, P10 7d,
      P14 7d, P19 3d, P21 10d); Phase 4 gating -> single batched call + 3.5s timeout trust-only fallback;
      P21.T5 watchdog alerts surface via Phase 14 diagnostics (cron_job_stuck)'
  - rev: r4
    change: 'Check 4 (final): P21.T11 deps P1.T6/P18.T4 -> P0.T3 (critical bugs T1+T11 executable right
      after Phase 0); P14.T1 += P18.T1 (backup_freshness); P14.T3 -> 12 alert rules (was 7); P4.T3
      benchmark rename test_full_injection_under_2s -> under_5s (hard budget, typical <2s); P0.T4
      nightly mutation job; phase_21 goal 10 -> 12 bugs; P22.T1 scheduling note; files renamed with
      check version (-r4)'
  - rev: r5
    change: 'Removed human labor-time estimates (user: the plan is executed by a coding agent/harness,
      not an engineer): dropped effort_hours from all tasks and phases, estimated_total_hours and
      effort_model from meta; plan loses Effort lines, day counts in phase headers, Hours column in
      Phase 21 tables, days in Section 7 diagram and Total estimate; execution order is defined by
      the dependency graph only. Runtime budgets (gate 3.5s, backup 25h, GEPA <8 days) untouched.
      Files renamed -r4 -> -r5'
  - rev: r6
    change: 'Full English translation of plan and tasks.yaml (single-language documents for
      any coding agent/harness); no content changes; files renamed -r5 -> -r6'
  - rev: r7
    change: 'Check 6 dry-run remediation (7 verdict points): fork-base pinned to v2026.9.24
      (commit f97608f; v0.18.2 does not exist upstream; migration artifacts renamed fork_to_v2_0);
      creator-first file plan: 20 files_to_modify-only paths moved to files_to_create (Phase 21
      tasks author the v2 modules they fix; hermes/core/agent.py created in P0.T3 per plan Phase 0
      Files; P14.T6 creates hermes/gateway/health.py instead of the bare directory); 9 dependency
      edges added (P18.T3 += P14.T4, P8.T2 += P3.T4, P11.T2 += P3.T5, P20.T6 += P21.T5/P17.T2/
      P17.T4/P19.T2, P19.T4 += P19.T2, P21.T6 += P21.T12); tests/**/__init__.py skeleton (P0.T3) keeps
      pytest default import mode working (pytest 9 removed the importmode ini option); 3 duplicate tests renamed with owning-phase suffix (_p20, _p8);
      P0.T4 ci.yml moved to files_to_modify; section 7 flags document P14.T1 -> P18.T1 and
      P3.T6 -> P11.T1. Files renamed -r6 -> -r7'
global_settings:
  python_version: '>=3.11'
  line_length: 100
  test_framework: pytest
  test_markers:
  - unit
  - integration
  - property
  - benchmark
  - e2e
  coverage_threshold: 85
  ci_required: true
  git_commit_format: '[{task_id}] {summary}'
  mutation_testing:
    tool: mutmut
    policy: all deterministic-logic unit/property tests must be mutation-tested (plan Section 4.7); LLM-glue,
      integration/e2e/chaos/benchmark and one-time migrations are out of scope
    per_pr_mode: diff_on_changed_modules
    nightly_full_run: true
    tier1_score_threshold: 0.95
    tier2_score_threshold: 0.85
    survivor_policy: fix_test_or_pragma_no_mutate_with_justification
phase_0:
  name: Foundation & fork setup
  goal: Fork Hermes, set up development environment, define v2.0 module skeleton
  tasks:
  - id: P0.T1
    title: Fork repository and verify baseline
    description: Fork NousResearch/hermes-agent to <org>/hermes-v2. Clone, install deps, run existing
      test suite. pyproject.toml carries the pytest config (markers unit, integration, property,
      benchmark, e2e); the tests/**/__init__.py skeleton (P0.T3) keeps duplicate test basenames
      importable in pytest's default import mode (pytest 9 has no importmode ini option - check 6
      C-IMPORTMODE).
    files_to_create:
    - pyproject.toml
    - .github/workflows/ci.yml
    files_to_modify: []
    tests_to_write:
    - tests/test_fork_baseline.py::test_existing_tests_pass
    - tests/test_fork_baseline.py::test_imports_clean
    acceptance_criteria:
    - All v2026.9.24 tests pass
    - Fork pushed to GitHub
    - pyproject.toml carries the pytest config with markers (check 6 C-IMPORTMODE)
    dependencies: []
    status: pending
  - id: P0.T2
    title: Configure tooling (ruff, mypy, pytest)
    description: Add ruff config (line=100, select E/F/W/I/N/UP/B/SIM), mypy strict for new modules, pytest
      markers.
    files_to_create:
    - ruff.toml
    files_to_modify:
    - pyproject.toml
    tests_to_write: []
    acceptance_criteria:
    - ruff check hermes/ clean
    - mypy hermes/memory/ clean (new modules only)
    - pytest --markers lists unit/integration/property/benchmark/e2e
    dependencies:
    - P0.T1
    status: pending
  - id: P0.T3
    title: Create module skeleton
    description: 'Create empty module directories with __init__.py: hermes/memory, hermes/mcp, hermes/models,
      hermes/traces, hermes/optimization, hermes/concurrency, hermes/diagnostics, hermes/skills, hermes/gateway.
      Also creates hermes/core/agent.py extended from the upstream run_agent.py (plan Phase 0
      Files) - the v2 agent module modified by Phases 2-8, 13, 15 and the Phase 21 fixes.
      Also creates the tests/**/__init__.py package skeleton (plan Appendix A) so duplicate
      test basenames across tests dirs stay importable in pytest default mode (check 6
      C-IMPORTMODE; pytest 9 has no importmode ini option).'
    files_to_create:
    - hermes/__init__.py
    - hermes/memory/__init__.py
    - hermes/mcp/__init__.py
    - hermes/models/__init__.py
    - hermes/traces/__init__.py
    - hermes/optimization/__init__.py
    - hermes/concurrency/__init__.py
    - hermes/diagnostics/__init__.py
    - hermes/skills/__init__.py
    - hermes/gateway/__init__.py
    - hermes/core/__init__.py
    - hermes/core/agent.py
    - hermes/config.py
    - tests/__init__.py
    - tests/unit/__init__.py
    - tests/unit/backup/__init__.py
    - tests/unit/concurrency/__init__.py
    - tests/unit/core/__init__.py
    - tests/unit/cron/__init__.py
    - tests/unit/diagnostics/__init__.py
    - tests/unit/gateway/__init__.py
    - tests/unit/mcp/__init__.py
    - tests/unit/memory/__init__.py
    - tests/unit/models/__init__.py
    - tests/unit/optimization/__init__.py
    - tests/unit/skills/__init__.py
    - tests/unit/storage/__init__.py
    - tests/unit/traces/__init__.py
    - tests/integration/__init__.py
    - tests/property/__init__.py
    - tests/chaos/__init__.py
    - tests/benchmark/__init__.py
    - tests/mutation/__init__.py
    files_to_modify: []
    tests_to_write:
    - tests/unit/test_module_skeleton.py::test_all_modules_import
    acceptance_criteria:
    - All modules import without errors
    - Python 3.11+ syntax verified
    dependencies:
    - P0.T1
    status: pending
  - id: P0.T4
    title: Set up CI pipeline
    description: 'GitHub Actions workflow: lint + type-check + unit tests on PR; integration tests on
      merge; nightly E2E + mutation run (mutmut per plan Section 4.7; full scope and thresholds
      are configured in P20.T5 — on the skeleton with an empty in-scope list the job is trivially
      green). Extends the ci.yml created in P0.T1.'
    files_to_create:
    - .github/workflows/nightly.yml
    - .pre-commit-config.yaml
    files_to_modify:
    - .github/workflows/ci.yml
    tests_to_write: []
    acceptance_criteria:
    - CI green on main branch
    - PR triggers lint+type+unit
    - Merge triggers integration tests
    - Nightly mutation job configured and green on baseline skeleton (Section 4.7)
    dependencies:
    - P0.T2
    - P0.T3
    status: pending
phase_1:
  name: Storage layer — atomic markdown graph in Git
  goal: Migrate storage to Git-backed atomic markdown graph with trust card frontmatter
  tasks:
  - id: P1.T1
    title: Define MemoryEntry and TrustCard dataclasses
    description: Implement dataclasses matching the trust card YAML schema in plan section 2.4.
    files_to_create:
    - hermes/memory/entry.py
    - hermes/memory/trust_card.py
    - hermes/memory/types.py
    files_to_modify: []
    tests_to_write:
    - tests/unit/memory/test_trust_card.py::test_parse_roundtrip
    - tests/unit/memory/test_trust_card.py::test_compute_trust_score_weighted_avg
    - tests/unit/memory/test_trust_card.py::test_verification_event_weights
    acceptance_criteria:
    - TrustCard parses YAML frontmatter correctly
    - trust_score in [0, 1] always
    - Verification event weights from config
    dependencies:
    - P0.T3
    status: pending
  - id: P1.T2
    title: Implement GitBackend
    description: 'Git operations via pygit2: init, commit, branch, merge, log, is_clean.'
    files_to_create:
    - hermes/memory/git_backend.py
    files_to_modify: []
    tests_to_write:
    - tests/unit/memory/test_git_backend.py::test_init_creates_repo
    - tests/unit/memory/test_git_backend.py::test_commit_returns_sha
    - tests/unit/memory/test_git_backend.py::test_log_returns_history
    - tests/unit/memory/test_git_backend.py::test_branch_and_merge
    - tests/unit/memory/test_git_backend.py::test_is_clean_after_commit
    acceptance_criteria:
    - Every write creates a Git commit
    - Branch/merge work as expected
    - is_clean() returns false on dirty state
    dependencies:
    - P0.T3
    status: pending
  - id: P1.T3
    title: Implement MemoryStore
    description: CRUD operations on memory entries with Git commit on every write. Context-aware (global
      vs contexts/<name>).
    files_to_create:
    - hermes/memory/store.py
    files_to_modify: []
    tests_to_write:
    - tests/unit/memory/test_store.py::test_add_creates_file_and_commits
    - tests/unit/memory/test_store.py::test_get_returns_entry
    - tests/unit/memory/test_store.py::test_update_modifies_trust_score
    - tests/unit/memory/test_store.py::test_remove_deletes_file
    - tests/unit/memory/test_store.py::test_list_filters_by_context_type_tag
    - tests/unit/memory/test_store.py::test_context_isolation
    acceptance_criteria:
    - Add creates atomic markdown file + Git commit
    - 'Context isolation: global fact not in context list'
    - All CRUD operations transactional
    dependencies:
    - P1.T1
    - P1.T2
    status: pending
  - id: P1.T4
    title: Implement BM25 search
    description: Search over all entries using rank_bm25. Index built on entry text + tags.
    files_to_create:
    - hermes/memory/search.py
    files_to_modify:
    - hermes/memory/store.py
    tests_to_write:
    - tests/unit/memory/test_search.py::test_bm25_returns_relevant_top_k
    - tests/unit/memory/test_search.py::test_empty_query_returns_empty
    - tests/unit/memory/test_search.py::test_search_filters_by_context
    acceptance_criteria:
    - BM25 search returns relevant entries in top-5 for typical queries
    - Search latency <100ms for 1000 entries
    dependencies:
    - P1.T3
    status: pending
  - id: P1.T5
    title: Implement file locking (flock)
    description: Prevent concurrent write corruption via fcntl.flock on ${HERMES_HOME}/.lock
    files_to_create:
    - hermes/memory/locking.py
    files_to_modify:
    - hermes/memory/store.py
    tests_to_write:
    - tests/unit/memory/test_locking.py::test_acquire_release
    - tests/unit/memory/test_locking.py::test_concurrent_acquire_blocks
    - tests/unit/memory/test_locking.py::test_lock_timeout
    acceptance_criteria:
    - Two concurrent writes don't corrupt files
    - Lock timeout configurable
    dependencies:
    - P1.T3
    status: pending
  - id: P1.T6
    title: Write fork-base migration script to v2.0
    description: Read old ~/.hermes/memories/*.md, parse entries, create new atomic files with default
      trust cards.
    files_to_create:
    - hermes/memory/migrations/fork_to_v2_0.py
    - scripts/migrate_fork_to_v2_0.py
    files_to_modify: []
    tests_to_write:
    - tests/integration/test_migration.py::test_fork_to_v2_0_preserves_entries
    - tests/integration/test_migration.py::test_fork_to_v2_0_sets_default_trust
    - tests/integration/test_migration.py::test_migration_dry_run_mode
    - tests/integration/test_migration.py::test_migration_rollback_script
    acceptance_criteria:
    - All v2026.9.24 memory entries migrate without data loss
    - 'Default trust_score: 0.5 for entries without explicit verification'
    - Dry-run mode reports changes without applying
    - Rollback script restores the fork-base format
    dependencies:
    - P1.T3
    status: pending
phase_2:
  name: Trust cards & provenance
  goal: Full trust card implementation, verification events, trust score computation, forgetting curve
  tasks:
  - id: P2.T1
    title: Implement verification event tracking
    description: Every memory operation creates a verification event. Trust score recomputed.
    files_to_create:
    - hermes/memory/verification.py
    files_to_modify:
    - hermes/memory/trust_card.py
    - hermes/memory/store.py
    tests_to_write:
    - tests/unit/memory/test_verification.py::test_add_event_updates_score
    - tests/unit/memory/test_verification.py::test_multiple_events_weighted_avg
    - tests/unit/memory/test_verification.py::test_user_explicit_higher_than_llm
    - tests/unit/memory/test_verification.py::test_test_green_highest_weight
    acceptance_criteria:
    - Every memory entry has >=1 verification event
    - Trust score = weighted avg of all events
    - 'Weights (plan 2.4): user-explicit=1.0, test-green=1.0, code-review-human=0.95, tool-output=0.85,
      file-read=0.7, agent-inferred=0.5, llm=0.3'
    dependencies:
    - P1.T1
    - P1.T3
    status: pending
  - id: P2.T2
    title: Implement forgetting curve
    description: 'Daily decay: score * exp(-0.01 * days_since_verification). Archive entries below 0.2.'
    files_to_create:
    - hermes/memory/decay.py
    files_to_modify: []
    tests_to_write:
    - tests/unit/memory/test_decay.py::test_decay_reduces_score_over_time
    - tests/unit/memory/test_decay.py::test_decay_zero_after_1_year
    - tests/unit/memory/test_decay.py::test_recently_verified_unchanged
    - tests/unit/memory/test_decay.py::test_archive_stale_moves_files
    - tests/unit/memory/test_decay.py::test_archived_recoverable
    acceptance_criteria:
    - Decay runs daily via cron
    - Entries with trust <0.2 archived to memory-repo/archive/
    - Archived entries recoverable
    dependencies:
    - P2.T1
    status: pending
  - id: P2.T3
    title: Implement verify MCP tool
    description: MCP tool callable by main agent to add verification events.
    files_to_create:
    - hermes/mcp/verify_tool.py
    files_to_modify: []
    tests_to_write:
    - tests/integration/test_verify_tool.py::test_verify_via_mcp_adds_event
    - tests/integration/test_verify_tool.py::test_verify_with_evidence_text
    - tests/integration/test_verify_tool.py::test_verify_test_green_event
    acceptance_criteria:
    - verify(entry_id, source, evidence) updates trust score
    - Tool accessible via MCP protocol
    dependencies:
    - P2.T1
    status: pending
  - id: P2.T4
    title: Add daily decay cron job
    description: Background scheduler runs decay daily at 03:00 local time.
    files_to_create:
    - hermes/memory/decay_scheduler.py
    files_to_modify: []
    tests_to_write:
    - tests/integration/test_decay_scheduler.py::test_cron_runs_daily
    - tests/integration/test_decay_scheduler.py::test_manual_trigger
    acceptance_criteria:
    - Decay runs automatically daily
    - Manual trigger via /diagnostics run-decay
    dependencies:
    - P2.T2
    status: pending
  - id: P2.T5
    title: Automatic ground-truth anchors (test/build hook)
    description: 'Hook on command execution (PostToolUse equivalent): when a test suite or build completes,
      find memory entries cited in the session / touching changed files, and append a test-green (weight
      1.0) or test-red event automatically. Implements the hypothesis element ''who verifies the verifier'':
      anchors are rule-based, not LLM-based.'
    files_to_create:
    - hermes/memory/anchors.py
    files_to_modify:
    - hermes/core/agent.py
    - hermes/memory/verification.py
    tests_to_write:
    - tests/unit/memory/test_anchors.py::test_test_green_appends_weight_1_event
    - tests/unit/memory/test_anchors.py::test_test_red_downweights_related_entries
    - tests/unit/memory/test_anchors.py::test_unrelated_entries_untouched
    - tests/integration/test_anchors.py::test_full_run_updates_trust_scores
    acceptance_criteria:
    - Test suite run automatically appends test-green/test-red events to related entries
    - No manual verify call needed for rule-based anchors
    - Unrelated entries untouched (matching by session citation + changed-file overlap)
    dependencies:
    - P2.T1
    status: pending
phase_3:
  name: Two-stage extractor + reviewer pipeline
  goal: Replace single memory tool with extractor subagent + reviewer subagent pipeline. Multi-turn context
    included (P3.T6, ex-round2 supplement).
  tasks:
  - id: P3.T1
    title: Define DraftFact and ReviewAction dataclasses
    description: 'DraftFact: proposed entry from extractor. ReviewAction: {action: add|update|skip|conflict,
      target_id, rationale}.'
    files_to_create:
    - hermes/memory/draft.py
    files_to_modify:
    - hermes/memory/types.py
    tests_to_write:
    - tests/unit/memory/test_draft.py::test_draft_fact_serialization
    - tests/unit/memory/test_draft.py::test_review_action_validates_action_enum
    acceptance_criteria:
    - DraftFact has all trust card fields (text, type, proposed_source, etc.)
    - ReviewAction.action in {add, update, skip, conflict}
    dependencies:
    - P1.T1
    status: pending
  - id: P3.T2
    title: Implement ExtractorAgent
    description: Agent that takes a turn and extracts draft facts. Uses the main model via Hermes LLM
      API (single-model architecture, r3). Outputs structured JSON.
    files_to_create:
    - hermes/memory/extractor.py
    files_to_modify: []
    tests_to_write:
    - tests/unit/memory/test_extractor.py::test_extracts_user_preference
    - tests/unit/memory/test_extractor.py::test_extracts_project_fact
    - tests/unit/memory/test_extractor.py::test_extracts_feedback_correction
    - tests/unit/memory/test_extractor.py::test_empty_turn_no_drafts
    - tests/unit/memory/test_extractor.py::test_structured_output_schema_valid
    - tests/property/test_extractor.py::test_output_always_valid_json
    acceptance_criteria:
    - Produces valid JSON for 95%+ of turns
    - 'Schema: [{type, text, proposed_source, confidence, context_hint}]'
    - Empty turn produces empty list
    dependencies:
    - P3.T1
    status: pending
  - id: P3.T3
    title: Implement ReviewerAgent
    description: Agent that takes drafts + existing entries (semantic search top-5) and decides add/update/skip/conflict.
    files_to_create:
    - hermes/memory/reviewer.py
    files_to_modify: []
    tests_to_write:
    - tests/unit/memory/test_reviewer.py::test_add_action_for_new_fact
    - tests/unit/memory/test_reviewer.py::test_update_action_for_related_existing
    - tests/unit/memory/test_reviewer.py::test_skip_action_for_exact_duplicate
    - tests/unit/memory/test_reviewer.py::test_conflict_detection_returns_special_action
    - tests/property/test_reviewer.py::test_action_always_in_allowed_set
    acceptance_criteria:
    - Correctly identifies duplicates in 90%+ cases
    - Conflict detection returns ReviewAction with action=conflict
    - 'Output schema: {action, target_id, rationale, merged_text?}'
    dependencies:
    - P3.T1
    - P3.T2
    status: pending
  - id: P3.T4
    title: Implement MemoryPipeline orchestrator
    description: 'Runs async after Stop hook: extract drafts -> review -> apply actions to MemoryStore.'
    files_to_create:
    - hermes/memory/pipeline.py
    files_to_modify: []
    tests_to_write:
    - tests/integration/test_pipeline.py::test_full_pipeline_turn_to_committed_entry
    - tests/integration/test_pipeline.py::test_pipeline_async_does_not_block_turn
    - tests/integration/test_pipeline.py::test_metrics_recorded
    - tests/integration/test_pipeline.py::test_conflict_triggers_resolution_flow
    acceptance_criteria:
    - Pipeline completes within 10s for typical turn (async)
    - All actions logged with rationale
    - Conflict actions trigger ReviewerAgent second pass with conflict context
    dependencies:
    - P3.T2
    - P3.T3
    - P1.T3
    status: pending
  - id: P3.T5
    title: Hook pipeline into Stop event
    description: Register Stop hook to trigger pipeline.run_after_turn(turn_id) async.
    files_to_create:
    - hermes/memory/hooks/stop_hook.py
    files_to_modify:
    - hermes/core/agent.py
    tests_to_write:
    - tests/integration/test_stop_hook.py::test_stop_triggers_pipeline
    - tests/integration/test_stop_hook.py::test_pipeline_failure_does_not_crash_session
    acceptance_criteria:
    - Stop hook fires pipeline async
    - Pipeline failure logged but doesn't crash session
    dependencies:
    - P3.T4
    status: pending
  - id: P3.T6
    title: Multi-turn context for extractor
    description: 'Extractor currently sees only current turn. Add multi-turn context window

      (last N turns from Trace Store or session history) so extractor can:

      - Understand references ("yes, use that approach" → which approach?)

      - Detect intent shifts across turns

      - Avoid re-extracting facts already confirmed in prior turns

      Implementation: pass last 3-5 turns as context to extractor prompt.

      Add new field to DraftFact: source_turn_ids (list of turns that contributed).

      '
    files_to_create:
    - hermes/memory/context_window.py
    files_to_modify:
    - hermes/memory/extractor.py
    - hermes/memory/draft.py
    tests_to_write:
    - tests/unit/memory/test_context_window.py::test_returns_last_n_turns
    - tests/unit/memory/test_context_window.py::test_filters_by_session
    - tests/unit/memory/test_extractor.py::test_extracts_with_multi_turn_context
    - tests/unit/memory/test_extractor.py::test_does_not_reextract_confirmed_facts
    - tests/unit/memory/test_extractor.py::test_resolves_references_across_turns
    - tests/integration/test_pipeline.py::test_multi_turn_extraction_workflow
    - tests/property/test_extractor.py::test_output_valid_with_any_context_size
    acceptance_criteria:
    - Extractor receives last 3-5 turns as context
    - References across turns resolved (e.g., 'that approach' -> extracted correctly)
