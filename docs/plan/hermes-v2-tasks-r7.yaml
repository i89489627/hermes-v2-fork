    - P11.T1
    status: pending
    notes: Requires Phase 11 (Trace Store) OR session history API. If Trace Store not yet available, can
      use in-memory session history as fallback initially.
phase_4:
  name: CBDC gating for proactive injection
  goal: Pre-step hook retrieves + gates (use/verify/ignore) + injects within budget
  tasks:
  - id: P4.T1
    title: Implement RetrievalEngine
    description: BM25 + optional vector search. Returns top-K candidates for a query.
    files_to_create:
    - hermes/memory/retrieval.py
    files_to_modify: []
    tests_to_write:
    - tests/unit/memory/test_retrieval.py::test_bm25_returns_relevant_top_k
    - tests/unit/memory/test_retrieval.py::test_empty_query_returns_empty
    - tests/unit/memory/test_retrieval.py::test_filters_by_context
    - tests/benchmark/test_retrieval_latency.py::test_bm25_under_100ms_for_1000_entries
    acceptance_criteria:
    - BM25 search <100ms for 1000 entries
    - Context-aware (only retrieves from active context + global)
    dependencies:
    - P1.T3
    - P1.T4
    status: pending
  - id: P4.T2
    title: Implement CBDCGate
    description: 'Main model classifies all top-3 retrieved candidates in ONE batched call (single prompt
      -> JSON decision list); check 3 replaced the former 3 sequential calls (3x1-3s would exceed the
      5s hook budget on a slow main model). BM25 pre-filter: only top-3 candidates are gated, not all
      retrieved. Budget enforcement (<=3 claims, <=1200 chars) is deterministic post-processing (mutation-tested,
      Tier-1 per Section 4.7). Hard timeout 3.5s -> fallback to trust-score-only gating (plan Section
      5.5).'
    files_to_create:
    - hermes/memory/gating.py
    files_to_modify: []
    tests_to_write:
    - tests/unit/memory/test_gating.py::test_use_decision_for_high_trust_relevant
    - tests/unit/memory/test_gating.py::test_verify_decision_for_medium_trust
    - tests/unit/memory/test_gating.py::test_ignore_decision_for_irrelevant
    - tests/unit/memory/test_gating.py::test_budget_claims_enforced
    - tests/unit/memory/test_gating.py::test_budget_chars_enforced
    - tests/unit/memory/test_gating.py::test_single_batched_call_per_turn
    - tests/unit/memory/test_gating.py::test_timeout_falls_back_to_trust_only
    - tests/property/test_gating.py::test_injected_count_never_exceeds_budget
    - tests/property/test_gating.py::test_all_injected_have_use_decision
    - tests/benchmark/test_gating_latency.py::test_cbdc_gate_under_3500ms
    acceptance_criteria:
    - 'Budget: <=3 claims, <=1200 chars per injection'
    - Single batched main-model call per turn (not 3 sequential)
    - Gate timeout 3.5s -> trust-only fallback; full hook <5s
    - 'Output: {decision, reason, candidate_id}'
    dependencies:
    - P4.T1
    status: pending
  - id: P4.T3
    title: Implement ContextInjector (stable/dynamic split)
    description: 'Stable context: global user profile + active context MEMORY.md, loaded once. Dynamic:
      per-turn gated facts.'
    files_to_create:
    - hermes/memory/injector.py
    files_to_modify: []
    tests_to_write:
    - tests/unit/memory/test_injector.py::test_stable_context_loaded_at_session_start
    - tests/unit/memory/test_injector.py::test_dynamic_context_changes_per_turn
    - tests/unit/memory/test_injector.py::test_stable_context_preserves_prefix_cache
    - tests/benchmark/test_injector_latency.py::test_full_injection_under_5s
    acceptance_criteria:
    - Stable context changes <=1 time per session
    - 'Full injection (retrieve+gate+inject): typical <2s, hard budget <5s (hook timeout)'
    - 'Output: additionalContext JSON for UserPromptSubmit hook'
    dependencies:
    - P4.T2
    - P5.T1
    status: pending
  - id: P4.T4
    title: Register UserPromptSubmit hook
    description: Pre-step hook calls injector.build_context(turn) and returns additionalContext.
    files_to_create:
    - hermes/memory/hooks/user_prompt_submit_hook.py
    files_to_modify:
    - hermes/core/agent.py
    tests_to_write:
    - tests/integration/test_hooks.py::test_pre_step_hook_injects_context
    - tests/integration/test_hooks.py::test_no_injection_when_no_relevant_facts
    - tests/integration/test_hooks.py::test_hook_timeout_handled_gracefully
    acceptance_criteria:
    - Hook completes within 2s for typical turn (5s timeout)
    - No injection when no relevant facts (don't pollute context)
    - Timeout returns empty additionalContext, doesn't crash
    dependencies:
    - P4.T3
    status: pending
