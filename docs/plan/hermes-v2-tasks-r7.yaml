    - tests/integration/test_acp.py::test_session_saved_before_failure
    - tests/integration/test_acp.py::test_no_bare_internal_error
    - tests/chaos/test_acp.py::test_editor_crash_during_turn
    acceptance_criteria:
    - Turn terminated cleanly when editor exits
    - Session state saved before failure
    - Descriptive error message (not bare 'Internal error')
    - Session can be reloaded after editor crash
    github_issue: https://github.com/NousResearch/hermes-agent/issues/156173
    dependencies:
    - P0.T3
